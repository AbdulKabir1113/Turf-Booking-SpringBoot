# ============================
# Server Config
# ============================
server.port=8080
# Keeping the same context path means the React frontend
# (BASE_URL = http://localhost:8080/TurfBooking) needs NO changes.
server.servlet.context-path=/TurfBooking

# ============================
# MySQL Datasource (same DB as the old servlet/JDBC backend)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/turf_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate Config
# ============================
# update = don't drop existing tables/data, just sync entities to schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================
# File upload (Add Turf thumbnail)
# ============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Folder on disk where uploaded turf images are stored
app.upload.dir=C:/TurfUploads
